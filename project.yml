name: Zenly

# ─────────────────────────────────────────────────────────────────────────────
# XcodeGen manifest — the single source of truth for Zenly's project structure.
# After editing this file, run `xcodegen generate` to rebuild Zenly.xcodeproj.
# Do NOT edit the generated .xcodeproj by hand.
# ─────────────────────────────────────────────────────────────────────────────

options:
  bundleIdPrefix: me.adithyan.shalinth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    DEVELOPMENT_TEAM: 649T62WKAQ
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # iPhone only (1). iPad (2) is deliberately not claimed: the Quiet layout is a
    # single non-scrolling iPhone column, the hero orb is sized against iPhone
    # screen heights, and Live Activities / Dynamic Island are iPhone-only. App
    # Review tests iPad when you declare it, so claiming untested support invites
    # a design rejection. Add "2" back once the iPad layout is actually built.
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_EMIT_LOC_STRINGS: YES

# App Group shared by every target. Defined once here, referenced in each
# target's entitlements below so the identifier can never drift.
fileGroups:
  - project.yml

targets:
  # ───────────────────────────── Main app ─────────────────────────────
  Zenly:
    type: application
    platform: iOS
    sources:
      - path: Zenly
      - path: Shared
    dependencies:
      - target: ZenlyMonitor
      - target: ZenlyShield
      - target: ZenlyShieldAction
      - target: ZenlyReport
      - target: ZenlyWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.Zenly
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Zenly/Info.plist
      properties:
        # User-facing app name on the Home Screen / Settings. Bundle id, App
        # Group, target and module names stay "Zenly" (identifiers).
        CFBundleDisplayName: "Zen-ly"
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Zenly uses only exempt encryption (HTTPS + Apple standard frameworks),
        # so declare no non-exempt encryption — stops the per-build export
        # compliance prompt in App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - zenly
        UIBackgroundModes:
          - processing
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - me.adithyan.shalinth.Zenly.refresh
    entitlements:
      path: Zenly/Zenly.entitlements
      properties:
        com.apple.developer.family-controls: true
        # Lets the schedule-start reminders break through Focus / Do Not Disturb.
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups:
          - group.me.adithyan.shalinth.Zenly

  # ─────────────── DeviceActivityMonitor extension (schedules) ───────────────
  ZenlyMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: ZenlyMonitor
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.Zenly.ZenlyMonitor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ZenlyMonitor/Info.plist
      properties:
        CFBundleDisplayName: ZenlyMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: ZenlyMonitor/ZenlyMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.me.adithyan.shalinth.Zenly

  # ─────────────── ShieldConfiguration extension (custom shield UI) ───────────────
  ZenlyShield:
    type: app-extension
    platform: iOS
    sources:
      - path: ZenlyShield
      - path: Shared/AppGroup.swift
      - path: Shared/DistractionLog.swift
      - path: Shared/ShieldMessage.swift
      - path: Shared/ActiveSessionInfo.swift
      - path: Shared/PausedApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.Zenly.ZenlyShield
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ZenlyShield/Info.plist
      properties:
        CFBundleDisplayName: ZenlyShield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: ZenlyShield/ZenlyShield.entitlements
      properties:
        # Required: this extension links ManagedSettings/ManagedSettingsUI.
        # Apple's automated review rejects any target using a Screen Time API
        # without it — the entitlement is needed on the app AND on every one of
        # its Screen Time extensions, each with its own approved request.
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.me.adithyan.shalinth.Zenly

  # ─────────────── ShieldAction extension (shield button handling) ───────────────
  ZenlyShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ZenlyShieldAction
      - path: Shared/AppGroup.swift
      - path: Shared/DistractionLog.swift
      # The five-minute door recomputes the shield in this process, so it needs
      # the same reconcile stack the app and the monitor use.
      - path: Shared/SnoozeStore.swift
      - path: Shared/ShieldReconciler.swift
      - path: Shared/ShieldApplier.swift
      - path: Shared/ActivityShieldStore.swift
      - path: Shared/SelectionCodec.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.Zenly.ZenlyShieldAction
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ZenlyShieldAction/Info.plist
      properties:
        CFBundleDisplayName: ZenlyShieldAction
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: ZenlyShieldAction/ZenlyShieldAction.entitlements
      properties:
        # Required: this extension links ManagedSettings/ManagedSettingsUI.
        # See the note on ZenlyShield above.
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.me.adithyan.shalinth.Zenly

  # ─────────────── DeviceActivityReport extension (app usage) ───────────────
  ZenlyReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: ZenlyReport
      - path: Shared/ReportContext.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.Zenly.ZenlyReport
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ZenlyReport/Info.plist
      properties:
        CFBundleDisplayName: ZenlyReport
        # DeviceActivityReport is an ExtensionKit extension (must live in
        # Extensions/, not PlugIns/, with EXAppExtensionAttributes).
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: ZenlyReport/ZenlyReport.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.me.adithyan.shalinth.Zenly

  # ───────────────────────── WidgetKit widget ─────────────────────────
  ZenlyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ZenlyWidget
      - path: Shared/AppGroup.swift
      - path: Shared/StatsSnapshot.swift
      - path: Shared/FocusActivityAttributes.swift
      - path: Shared/Color+Hex.swift
      - path: Shared/StartFocusIntent.swift
      - path: Shared/FocusLaunchRequest.swift
      - path: Shared/SessionControlIntents.swift
      - path: Shared/SessionControlRequest.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.Zenly.ZenlyWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ZenlyWidget/Info.plist
      properties:
        CFBundleDisplayName: "Zen-ly"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ZenlyWidget/ZenlyWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.me.adithyan.shalinth.Zenly

  # ───────────────────────────── Tests ─────────────────────────────
  ZenlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZenlyTests
    dependencies:
      - target: Zenly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.ZenlyTests
        GENERATE_INFOPLIST_FILE: YES

  ZenlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ZenlyUITests
    dependencies:
      - target: Zenly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.ZenlyUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Zenly:
    build:
      targets:
        Zenly: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZenlyTests
        - ZenlyUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
